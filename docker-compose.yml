services:
  library-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-management-system
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/books"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
